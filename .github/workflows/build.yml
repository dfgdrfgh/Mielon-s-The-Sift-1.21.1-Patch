name: Build Mielon's The Sift (Fabric 1.21.1)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Fabric 1.21.1
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Compile and remap Fabric mod
        run: ./gradlew --no-daemon --stacktrace build

      - name: Check dimension weather and spawn eggs in Minecraft
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          timeout 10m xvfb-run -a ./gradlew --no-daemon -PspawnEggCheck runSpawnEggCheck
          test -f run/spawn-egg-check/spawn-eggs-pass.txt
          test -f run/spawn-egg-check/weather-isolation-pass.txt

      - name: Verify weather regression detects the old behavior
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        shell: bash
        run: |
          cp build/resources/main/the_sift.mixins.json weather-mixins-backup.json
          trap 'cp weather-mixins-backup.json build/resources/main/the_sift.mixins.json' EXIT
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('build/resources/main/the_sift.mixins.json')
          config = json.loads(path.read_text())
          config['mixins'].remove('ServerLevelWeatherMixin')
          path.write_text(json.dumps(config))
          PY
          set +e
          timeout 10m xvfb-run -a ./gradlew --no-daemon -PspawnEggCheck -x processResources runSpawnEggCheck > weather-control.log 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          grep -F 'Natural Sift rain leaked into the Overworld' weather-control.log
          echo SIFT_WEATHER_UNPATCHED_CONTROL_PASS

      - name: Stage installable mod JAR
        shell: bash
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' ! -name '*-javadoc.jar' \
            -exec cp -v {} release/ \;
          find release -maxdepth 1 -name '*.jar' -print
          test "$(find release -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
          jar tf release/*.jar > /dev/null
          sha256sum release/*.jar

      - name: Upload compiled Fabric mod
        uses: actions/upload-artifact@v4
        with:
          name: Mielons-The-Sift-Fabric-1.21.1
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30

