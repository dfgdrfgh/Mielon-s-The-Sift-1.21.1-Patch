plugins { id 'fabric-loom' version '1.9.2' }
version = '1.1.2-fabric-backport.12'
group = 'mielon.thesift'
base { archivesName = 'mielons-the-sift-1.21.1' }
repositories { mavenCentral() }
dependencies {
 minecraft 'com.mojang:minecraft:1.21.1'
 mappings loom.officialMojangMappings()
 modImplementation 'net.fabricmc:fabric-loader:0.19.5'
 modImplementation 'net.fabricmc.fabric-api:fabric-api:0.116.17+1.21.1'
 modImplementation files('libs/geckolib-fabric-1.21.1-4.9.3.jar')
}
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.release = 21; options.compilerArgs += ['-Xmaxerrs', '1000'] }

// Optional client integration check, kept out of the installable mod and sources JAR.
if (project.hasProperty('spawnEggCheck')) {
 sourceSets {
  spawnEggCheck {
   compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
   runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
  }
 }
 loom {
  mods {
   the_sift { sourceSet sourceSets.main }
   the_sift_spawn_egg_check { sourceSet sourceSets.spawnEggCheck }
  }
  runs {
   spawnEggCheck {
    client()
    source sourceSets.spawnEggCheck
    runDir 'run/spawn-egg-check'
    ideConfigGenerated false
   }
  }
 }
}

